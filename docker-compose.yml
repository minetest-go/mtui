
services:
 ui_webapp:
  image: node:22.22.3
  volumes:
   - "./:/app"
  working_dir: /app/public
  environment:
   API_TARGET: "http://ui:8080"
  ports:
   - 5173:5173
  # builds the embedded webapp for the backend, then starts the vite dev server
  command: bash -c 'npm ci && npm run build && npm run dev -- --host'
  healthcheck:
    test: ["CMD", "test", "-f", "/app/public/dist/index.html"]
    interval: 5s
    timeout: 10s
    retries: 30
    start_period: 120s

 ui:
  image: golang:1.27.2
  hostname: ui
  environment:
   WORLD_DIR: "/world"
   API_KEY: "mykey"
   #LOGLEVEL: debug
   SERVER_NAME: "dev-server"
   MINETEST_CONFIG: "/world/minetest.conf"
   WASM_MINETEST_HOST: "luanti"
   ENABLE_FEATURES: "api,shell,luashell,minetest_config,modmanagement,signup,chat,minetest_web"
  depends_on:
    ui_webapp:
      condition: service_healthy
    luanti:
      condition: service_started
  ports:
    - 8080:8080
  volumes:
   - "./:/app"
   - "world_dir:/world"
   - "./cache/go_dir:/go"
   - "./cache/go_cache:/root/.cache"
  working_dir: /app
  command: ["go", "run", "."]

 luanti:
  image: ghcr.io/luanti-org/luanti:5.17.0
  user: root
  restart: always
  volumes:
   - "./world.mt:/root/.minetest/worlds/world/world.mt"
   - "world_dir:/root/.minetest/worlds/world"
  ports:
   - "30000:30000/udp"
  command: ["--config", "/root/.minetest/worlds/world/minetest.conf", "--logfile", "/root/.minetest/worlds/world/debug.txt"]

volumes:
  world_dir: {}
